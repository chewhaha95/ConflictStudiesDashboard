name: Deploy to GitHub Pages

# Publishes the static dashboard to GitHub Pages on every push to the default
# branch. Uses actions/configure-pages with enablement: true so Pages is turned
# on automatically the first time this runs — no manual repo-settings step.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. Not cancel-in-progress: the feed and weekly sync
# workflows deploy in this group too, and cancelling their deploy would leave
# the site behind the data they just committed. Deploys are short; queue them.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages (enable if needed)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Stamp asset versions (cache busting)
        # Rewrites app.js?v=… / styles.css?v=… to the deployed commit so browsers never
        # keep a stale script after a deploy. Applied to the artifact only, not committed.
        run: |
          v="${GITHUB_SHA::10}"
          sed -i -E "s/(app\.js|styles\.css)\?v=[A-Za-z0-9]+/\1?v=$v/g" conflict-dashboard.html
          grep -o '(app\.js|styles\.css)?v=[A-Za-z0-9]*' -E conflict-dashboard.html

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # The whole repo root is the static site; index.html redirects to
          # conflict-dashboard.html. .nojekyll disables Jekyll processing.
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
