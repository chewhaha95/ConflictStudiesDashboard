name: Sync watchlist open-source feed

# Refreshes the Watchlist's live reporting feed (watchlist-live.json) from the
# open GDELT DOC 2.0 API — 30-day coverage timelines and the latest relevant
# articles per watchlist item — then commits it and deploys to Pages so the
# Watchlist tab's coverage sparklines, surge flags and "latest reporting"
# lists stay current without anyone touching the repo.
#
# Runs every 6 hours and on demand. GDELT throttles shared runner IPs, so the
# script retries with backoff, falls back to Google News RSS, refreshes the
# stalest items first and keeps previous data for the rest — the feed converges
# across runs. It exits non-zero only when nothing at all could be refreshed.

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours (UTC), off the hour to avoid GDELT peaks
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync open-source feed (GDELT)
        run: node scripts/sync-watchlist-feed.js

      - name: Commit feed (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add watchlist-live.json
          if git diff --staged --quiet; then
            echo "No change to watchlist-live.json."
          else
            git commit -m "chore: sync watchlist open-source feed"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Stamp asset versions (cache busting)
        # Rewrites app.js?v=… / styles.css?v=… to the deployed commit so browsers never
        # keep a stale script after a deploy. Applied to the artifact only, not committed.
        run: |
          v="${GITHUB_SHA::10}"
          sed -i -E "s/(app\.js|styles\.css)\?v=[A-Za-z0-9]+/\1?v=$v/g" conflict-dashboard.html
          grep -o '(app\.js|styles\.css)?v=[A-Za-z0-9]*' -E conflict-dashboard.html

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
