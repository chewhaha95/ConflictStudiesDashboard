name: Sync watchlist open-source feed

# Refreshes the Watchlist's live reporting feed (watchlist-live.json) from the
# open GDELT DOC 2.0 API — 30-day coverage timelines and the latest relevant
# articles per watchlist item — then commits it and deploys to Pages so the
# Watchlist tab's coverage sparklines, surge flags and "latest reporting"
# lists stay current without anyone touching the repo.
#
# Runs hourly (fired by the Cloudflare Worker cron in cloudflare/feed-trigger;
# GitHub's own schedule below is a late-running fallback) and on demand. GDELT
# throttles shared runner IPs, so the script retries with backoff, falls back to Google News RSS, refreshes the
# stalest items first and keeps previous data for the rest — the feed converges
# across runs. It exits non-zero only when nothing at all could be refreshed.

on:
  schedule:
    - cron: "7 * * * *"      # hourly, off the hour to avoid GDELT peaks
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  models: read          # GitHub Models: free headline relevance screen with GITHUB_TOKEN

jobs:
  # The sync runs in its own concurrency group so a Pages deploy from a merge
  # to main can never cancel a 15–40 minute GDELT run (it did: a merge during
  # a sync cancelled it). Only the short deploy job shares the "pages" group.
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    concurrency:
      group: watchlist-feed-sync
      cancel-in-progress: false
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies (relevance screen SDK)
        run: npm ci --omit=dev --no-fund --no-audit

      - name: Sync open-source feed (GDELT + Google News, model relevance screen)
        # Headline relevance cross-check: Claude if ANTHROPIC_API_KEY is set as a
        # repository secret, else GitHub Models (free for Actions) with GITHUB_TOKEN,
        # else title heuristics only.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-watchlist-feed.js

      - name: Commit feed (if changed)
        # This workflow touches only the Watchlist tab's data. The Weekly,
        # Monthly and Capabilities tabs are outside its scope (weekly-live.json
        # is synced by sync-weekly.yml on its own schedule).
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add watchlist-live.json
          if git diff --staged --quiet; then
            echo "No change to watchlist-live.json."
          else
            git commit -m "chore: sync watchlist open-source feed"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

  # Deploys the head of main (including the commit just pushed above — pushes
  # made with GITHUB_TOKEN do not trigger pages.yml on their own).
  deploy:
    needs: sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Stamp asset versions (cache busting)
        # Rewrites app.js?v=… / styles.css?v=… to the deployed commit so browsers never
        # keep a stale script after a deploy. Applied to the artifact only, not committed.
        run: |
          v="$(git rev-parse --short=10 HEAD)"
          sed -i -E "s/(app\.js|styles\.css)\?v=[A-Za-z0-9]+/\1?v=$v/g" conflict-dashboard.html
          grep -o '(app\.js|styles\.css)?v=[A-Za-z0-9]*' -E conflict-dashboard.html

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
